services:
  db:
    image: postgres:18-alpine
    container_name: be-market-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: be_market_back
      POSTGRES_USER: icael
      POSTGRES_PASSWORD: change_me
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icael -d be_market_back"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: be-market-back
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: be_market_back
      DB_USERNAME: icael
      DB_PASSWORD: change_me
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost
      VITE_API_URL: http://localhost:8000
      PAYMENT_SANDBOX: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SANCTUM_STATEFUL_DOMAINS: localhost,127.0.0.1,::1
      ADMIN_SEED_NAME: Admin
      ADMIN_SEED_EMAIL: admindev.tech@gmail.com
      ADMIN_SEED_PASSWORD: Admindev.tech@171204
    volumes:
      - .:/var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    build:
      context: ../be-market-front
      dockerfile: Dockerfile
    container_name: be-market-front
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:8000
    volumes:
      - ../be-market-front:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
