name: be-market-prod
services:
  db:
    image: postgres:18-alpine
    container_name: be-market-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: be_market_back
      POSTGRES_USER: icael
      POSTGRES_PASSWORD: change_me
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icael -d be_market_back"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: be-market-redis-prod
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./be-market-back
      dockerfile: Dockerfile.prod
    container_name: be-market-back-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: be_market_back
      DB_USERNAME: icael
      DB_PASSWORD: change_me
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_LIFETIME: 120
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:3nQqrzgRRXUTxVVwQMq9gsOvwKGcB/1ffDypCE2RO3w=
      APP_URL: https://bemarket.tg
      VITE_API_URL: https://api.bemarket.tg
      ADMIN_SEED_NAME: Admin
      ADMIN_SEED_EMAIL: admin@bemarket.tg
      ADMIN_SEED_PASSWORD: Admindev.tech@171204
      PAYMENT_SANDBOX: "false"
      FEDEPAY_API_KEY: ${FEDEPAY_API_KEY}
      FEDEPAY_BASE_URL: https://api.fedapay.com/v1
      FEDEPAY_SANDBOX_BASE_URL: https://sandbox-api.fedapay.com/v1
      PAYMENT_CALLBACK_URL: https://api.bemarket.tg/api/payment/callback
      PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET}
      CORS_ALLOWED_ORIGINS: https://bemarket.tg,https://www.bemarket.tg
      SANCTUM_STATEFUL_DOMAINS: bemarket.tg,www.bemarket.tg
    volumes:
      - bemarket-storage:/var/www/html/storage

  frontend:
    build:
      context: ./be-market-front
      dockerfile: Dockerfile.prod
    container_name: be-market-front-prod
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    container_name: be-market-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/prod/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  bemarket-storage:
